# CI GitHub Actions — biscuits-ia
#
# Raison d'etre (cf. audit.md §11) : les seuls invariants qui empechent
# un commit de re-casser involontairement les fixes de l'audit P1 sont
# les assertions sur l'ARTEFACT PRODUIT (dist/client/), pas la relecture
# du source.
#
# Etapes :
#   1. install           -- dependances (lockfile)
#   2. type-check        -- astro check (TypeScript strict)
#   3. build             -- astro build
#   4. assert-invariants -- scripts/assert-build-invariants.mjs
#   5. lint              -- eslint (skippé si pas de config flat)
#
# Si une etape echoue, le PR ne peut pas etre merge.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annulation automatique de l'ancienne run sur push force / nouveau commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (type-check + build + invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check (astro check)
        run: bunx astro check

      - name: Build (astro build)
        run: bun run build
        env:
          # Les variables d'env ne sont pas requises pour le build (elles ne
          # sont utilisees qu'au runtime). Mais certaines peuvent etre
          # referencees par import.meta.env dans des scripts importes par
          # les pages prerendered.
          SITE_URL: https://biscuits-ia.com
          PUBLIC_SITE_URL: https://biscuits-ia.com

      - name: Assert build invariants
        # Ce script lit dist/client/ et verifie que les fixes de l'audit
        # P1 sont bien sur l'ARTEFACT, pas seulement dans le source.
        # Cf. scripts/assert-build-invariants.mjs (en-tete).
        run: node scripts/assert-build-invariants.mjs

      - name: Lint (skip si pas de config flat)
        # TODO P2 #17 : creer eslint.config.js (flat config) et retirer ce skip.
        # L'ancien format .eslintrc est obsolete avec ESLint 10.
        run: |
          if [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            bun run lint
          else
            echo "::warning::Pas de eslint.config.js : lint skippe (TODO P2 #17)"
          fi
