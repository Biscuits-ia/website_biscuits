# CI GitHub Actions — biscuits-ia
#
# Raison d'etre (cf. audit.md §11) : les seuls invariants qui empechent
# un commit de re-casser involontairement les fixes de l'audit P1 sont
# les assertions sur l'ARTEFACT PRODUIT (dist/client/), pas la relecture
# du source.
#
# Etapes :
#   1. install           -- dependances (lockfile npm)
#   2. type-check        -- astro check (TypeScript strict)
#   3. build             -- astro build
#   4. assert-invariants -- scripts/assert-build-invariants.mjs
#   5. lint              -- eslint (inconditionnel)
#
# Si une etape echoue, le PR ne peut pas etre merge.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annulation automatique de l'ancienne run sur push force / nouveau commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (type-check + build + invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Note : on utilise npm (et non bun) depuis P4 #28, qui a supprime
      # bun.lock. Le projet n'a aucune dep "bun" ; `bun install --frozen-lockfile`
      # ne trouve pas de lockfile et echoue. `npm ci` lit package-lock.json,
      # qui est la source de verite unique depuis #28.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npx astro check

      - name: Build (astro build)
        run: npm run build
        env:
          # Les variables d'env ne sont pas requises pour le build (elles ne
          # sont utilisees qu'au runtime). Mais certaines peuvent etre
          # referencees par import.meta.env dans des scripts importes par
          # les pages prerendered.
          SITE_URL: https://biscuits-ia.com
          PUBLIC_SITE_URL: https://biscuits-ia.com

      - name: Assert build invariants
        # Ce script lit dist/client/ et verifie que les fixes de l'audit
        # P1 sont bien sur l'ARTEFACT, pas seulement dans le source.
        # Cf. scripts/assert-build-invariants.mjs (en-tete).
        run: node scripts/assert-build-invariants.mjs

      - name: Lint (eslint)
        # Inconditionnel depuis 2026-08-02. La garde `if [ -f eslint.config.js ]`
        # datait de l'epoque ou la flat config n'existait pas encore (TODO P2 #17,
        # resolu). Elle etait devenue un angle mort : config renommee ou
        # supprimee = CI verte avec un simple ::warning::, alors que la regle
        # maison no-unguarded-auth-result (eslint-rules/require-auth-narrow.cjs)
        # est un garde-fou d'authentification. Un `requireAdmin()` sans
        # `instanceof Response` ne fait pas echouer `astro check` : ESLint est
        # le seul filet sur ce contrat, il doit donc echouer bruyamment.
        run: npm run lint

  # ── Audit de contraste axe-core (cf. audit.md P2 #38) ──────────────────────
  # `astro preview` ne fonctionne pas avec l'adaptateur Vercel (message :
  # "The @astrojs/vercel adapter does not support the preview command."). On
  # sert donc le build statique (dist/client/) via un mini serveur Node lance
  # en arriere-plan. Le spec s'appuie sur PLAYWRIGHT_BASE_URL pour pointer
  # sur ce serveur.
  a11y-contrast:
    name: a11y contrast (axe-core)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build (pour servir dist/client/)
        run: npm run build
        env:
          SITE_URL: https://biscuits-ia.com
          PUBLIC_SITE_URL: https://biscuits-ia.com
      - name: Serveur statique (dist/client/)
        # Script minimal : sert les fichiers, resout les dossiers en
        # index.html, fallback .html. Pas d'install : Node est deja la.
        run: |
          cat > /tmp/serve.mjs << 'EOF'
          import { createServer } from 'http';
          import { readFile, stat } from 'fs/promises';
          import { join, extname } from 'path';
          const ROOT = './dist/client';
          const TYPES = { '.html': 'text/html', '.js': 'application/javascript', '.css': 'text/css', '.svg': 'image/svg+xml', '.webp': 'image/webp', '.woff2': 'font/woff2', '.json': 'application/json', '.xml': 'application/xml' };
          createServer(async (req, res) => {
            const p = req.url.split('?')[0];
            try {
              const file = p === '/' ? join(ROOT, 'index.html') : join(ROOT, p);
              const s = await stat(file);
              const target = s.isDirectory() ? join(file, 'index.html') : file;
              const data = await readFile(target);
              res.writeHead(200, { 'content-type': TYPES[extname(target)] || 'application/octet-stream' });
              res.end(data);
            } catch {
              try { const d = await readFile(join(ROOT, p + '.html')); res.writeHead(200, { 'content-type': 'text/html' }); res.end(d); }
              catch { res.writeHead(404); res.end('NF'); }
            }
          }).listen(4321, () => console.log('serveur 4321'));
          EOF
          (node /tmp/serve.mjs &) && sleep 2
      - name: Audit axe-core
        env:
          CI: 'true'   # spec : mode "barometre", ne fail pas (cf. entete du spec)
          PLAYWRIGHT_BASE_URL: http://localhost:4321
        run: npx playwright test tests/e2e/a11y-contrast.spec.ts

  # ── Scan secrets (cf. audit.md P2 #39) ────────────────────────────────────
  # Deux modes : gitleaks (l'historique git + le working tree) bloque le PR
  # des qu'un pattern de la config .gitleaks.toml matche.
  secrets-scan:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 indispensable : gitleaks scanne l'historique
          # complet, pas seulement HEAD.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # En PR : ne sort pas en erreur sur les findings "redact" du
          # working tree (artefacts, fichiers temporaires). On garde
          # strict sur l'historique.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
