# ============================================================
# Configuration Serena — projet Astro (JS/TS)
# À placer dans : .serena/project.yml (à la racine du projet)
# ============================================================

# Nom du projet dans Serena (utilisé pour l'activer par son nom)
project_name: "mon-projet-astro"

# IMPORTANT : Astro (.astro) n'a pas de language server dédié dans Serena.
# Les fichiers .astro seront donc lus/édités en mode "texte" (recherche par motif,
# remplacement de lignes) plutôt qu'en navigation par symboles.
# En revanche, tout le JS/TS "pur" du projet bénéficie du support complet
# (find_symbol, find_referencing_symbols, etc.) via typescript-language-server :
#   - composants framework (.jsx/.tsx si tu utilises React/Preact/Solid)
#   - scripts utilitaires (.js/.ts)
#   - routes API (src/pages/api/*.ts)
#   - astro.config.mjs / astro.config.ts
# Note : pour du JavaScript, Serena utilise la clé "typescript" (qui couvre aussi le JS).
languages:
  - typescript

# Respecte ton .gitignore (par défaut Astro y met déjà node_modules/, dist/, .astro/)
ignore_all_files_in_gitignore: true

# Filet de sécurité supplémentaire, même syntaxe que .gitignore
ignored_paths:
  - dist/**
  - .astro/**
  - node_modules/**

# Passe à true pour interdire toute modification du code (analyse seule)
read_only: false

excluded_tools: []
included_optional_tools: []

# Contexte donné automatiquement à l'agent à chaque activation du projet.
# Adapte-le à la structure réelle de ton projet.
initial_prompt: |
  Ce projet est construit avec Astro (JS/TS). Structure habituelle :
  - src/pages/       -> routes (fichiers .astro, et .ts pour les routes API)
  - src/components/  -> composants .astro et/ou composants framework (.jsx/.tsx/.vue/.svelte)
  - src/layouts/     -> layouts .astro
  - src/content/     -> collections de contenu (si Content Collections est utilisé)
  - public/          -> fichiers statiques servis tels quels
  - astro.config.mjs -> configuration Astro

  Les fichiers .astro combinent un bloc "frontmatter" JS/TS (entre ---) en haut du
  fichier et un template proche du HTML en dessous. Pour ces fichiers, privilégie
  les outils texte (read_file, search_for_pattern, replace_lines) plutôt que les
  outils de symboles, qui ne fonctionnent pleinement que sur les fichiers .js/.ts/.jsx/.tsx.

encoding: utf-8